version: 1
server:
  host: 127.0.0.1
  port: 8090
models:
  - id: l1
    name: qwen3.6-0.8b
    endpoint: http://127.0.0.1:8081/v1
    model: qwen3.6-0.8b
    role: router
    timeout_seconds: 10
    temperature: 0.1
    max_tokens: 2560
  - id: l2
    name: lfm2.5-8b-a1b
    endpoint: http://127.0.0.1:8082/v1
    model: lfm2.5-8b-a1b
    role: worker
    timeout_seconds: 60
    temperature: 0.2
    max_tokens: 20480
routing:
  rules:
    - name: long_prompt
      enabled: true
      condition: {prompt_chars: {gt: 5000}}
      route: l2
    - name: coding
      enabled: true
      condition: {keywords: {any: [implement, refactor, debug, repository, source code]}}
      route: l2
    - name: architecture
      enabled: true
      condition: {keywords: {any: [architecture, system design]}}
      route: l2
  default_route: l1
l1:
  routing_prompt: |
    You are the L1 local AI model and router.
    Decide whether you can answer the user's request directly or L2 is required.
    Return ONLY valid JSON. If route is l1, answer must contain the complete user-facing answer.
    Schema: {"route":"l1|l2","confidence":0.0,"reason_code":"string","answer":"string"}
  low_confidence_threshold: 0.70
