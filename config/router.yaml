version: 1
server:
  host: 127.0.0.1
  port: 8090
models:
  - id: l1
    name: lfm2.5-1.2b
    endpoint: http://127.0.0.1:8081/v1
    model: lfm2.5-1.2b
    timeout_seconds: 30
    temperature: 0.0
    max_tokens: 256
  - id: l2
    name: lfm2.5-8b-a1b
    endpoint: http://127.0.0.1:8082/v1
    model: lfm2.5-8b-a1b
    timeout_seconds: 60
    temperature: 0.2
    max_tokens: 2048
  - id: l3
    name: qwen3.6-35b-a3b
    endpoint: http://127.0.0.1:8083/v1
    model: qwen3.6-35b-a3b
    timeout_seconds: 120
    temperature: 0.2
    max_tokens: 4096
routing:
  rules:
    - name: long_prompt
      enabled: true
      condition: {prompt_chars: {gt: 5000}}
      route: l2
    - name: coding
      enabled: true
      condition: {keywords: {any: [implement, refactor, debug, repository, source code]}}
      route: l2
    - name: architecture
      enabled: true
      condition: {keywords: {any: [architecture, system design]}}
      route: l2
  default_route: l1
l1:
  routing_prompt: |
    You are L1, a fast local router.
    Use route=l1 only when you can answer the request correctly with a short response and without multi-step reasoning.
    Use route=l2 for coding, debugging, architecture, mathematics, calculations, complex reasoning, comparisons, trade-offs, long-context requests, or uncertainty.
    If confidence is below 0.90, use route=l2.
    Return ONLY one JSON object.
    For route=l1 include the complete user-facing answer.
    For route=l2 set answer to an empty string.
    Schema: {"route":"l1|l2","confidence":0.0,"reason_code":"brief_reason","answer":""}
  low_confidence_threshold: 0.70
